name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:            # botón "Run workflow" para redeploy manual

concurrency:
  group: deploy-notebook        # nunca dos deploys a la vez
  cancel-in-progress: false

permissions:
  contents: read
  packages: write               # permite a GITHUB_TOKEN publicar en GHCR

env:
  IMAGE: ghcr.io/ruizamdev/notebook.ruizam.dev
  APP_DIR: /srv/apps/notebook

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Copiar docker-compose.yml al VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          source: docker-compose.yml
          target: ${{ env.APP_DIR }}

      - name: Pull y recrear contenedor
        uses: appleboy/ssh-action@v1
        with:
           host: ${{ secrets.VPS_HOST }}
           username: deploy
           key: ${{ secrets.VPS_SSH_KEY }}
           fingerprint: ${{ secrets.VPS_FINGERPRINT }}
           script: |
             set -e
             cd ${{ env.APP_DIR }}
             docker compose pull
             docker compose up -d --no-build --remove-orphans
             docker image prune -f
             docker compose ps
