server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Detrás de Traefik (TLS): redirecciones relativas para no saltar a http://
  absolute_redirect off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  
  # Docusaurus genera /ruta/index.html o /ruta.html
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Assets con has en el nombre: cache de 1 añoff
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  error_page 404 /404.html;
}
